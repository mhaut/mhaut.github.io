# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Juan M. Haut
first_name: Juan Mario
middle_name:
last_name: Haut
email: juanmariohaut@unex.es
description: >
  Associate Professor at the University of Extremadura. HyperComp Lab.
  Deep Learning · Hyperspectral Imaging · GPU/HPC · Remote Sensing.
footer_text:
keywords: hyperspectral, deep-learning, GPU, HPC, remote-sensing, computer-architecture

url: https://mhaut.github.io
baseurl:
last_updated: true

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: false
search_enabled: true
socials_in_search: true

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

serve_og_meta: true
serve_schema_org: true
og_image: /assets/img/profile.png

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------

github_username: mhaut
scholar_userid: zLffeY8AAAAJ
orcid_id: 0000-0001-6701-961X
scopus_id: 57215636081
semanticscholar_id:
research_gate_profile:
ieee_id:

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------

google_analytics:
cronos_analytics:

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog:
  enabled: false

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & Coverage
include: ["_pages"]
exclude:
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

# Plug-ins
plugins:
  - jekyll-archives
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Haut]
  first_name: [Juan M., J.M., Juan Mario]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics: false
enable_cronos_analytics: false
enable_google_verification: false
enable_bing_verification: false
enable_masonry: true
enable_math: false
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: true
enable_medium_zoom: true
enable_progressbar: true
enable_video_embedding: false

# -----------------------------------------------------------------------------
# Library versions
# -----------------------------------------------------------------------------

bootstrap-table:
  version: "1.22.1"
chartjs:
  version: "4.4.1"
d3:
  version: "7.8.5"
datatables:
  version: "1.13.6"
jquery:
  version: "3.6.0"
leaflet:
  version: "1.9.4"
mathjax:
  version: "3.2.0"
masonry:
  version: "4.2.2"
medium_zoom:
  version: "1.1.0"
mermaid:
  version: "10.7.0"
vega:
  version: "5.27.0"
vega-embed:
  version: "6.24.0"
vega-lite:
  version: "5.16.3"
