name: Build CV PDF

on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "_bibliography/papers.bib"
      - "bin/render_cv_pdf.py"
      - "bin/requirements-cv.txt"
      - ".github/workflows/render-cv.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cv-pdf:
    name: Generate downloadable CV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bin/requirements-cv.txt
      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r bin/requirements-cv.txt
      - name: Generate CV
        run: python bin/render_cv_pdf.py
      - name: Upload CV
        uses: actions/upload-artifact@v4
        with:
          name: Juan-M-Haut-CV
          path: output/pdf/juan-m-haut-cv.pdf
          if-no-files-found: error
