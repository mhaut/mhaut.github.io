cv:
  name: Juan Mario Haut Hurtado
  label: Tenured Associate Professor (Profesor Titular de Universidad)
  email: juanmariohaut@unex.es
  location: Cáceres, Spain
  image: ""
  summary: >
    Tenured Associate Professor (Profesor Titular de Universidad) at the Department of Computer and Communication Technology,
    University of Extremadura, and member of the Hyperspectral Computing Laboratory (HyperComp). Research focused on
    deep learning for hyperspectral remote sensing, GPU acceleration and distributed computing, with an emphasis on
    computational efficiency. IEEE Senior Member, Chair of the Spanish Chapter of IEEE GRSS, Associate Editor of
    Remote Sensing, and Editorial Board Member of Scientific Reports. See the [publication list](/publications/) for journal articles and conference contributions.

